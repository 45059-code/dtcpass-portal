        <!-- QR Code generator (no external image API needed) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script>
            // ── Session Authentication Check (Silent Direct Redirect) ───────
            (function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno') || '7502032600973';
                if (sessionStorage.getItem('epass_authenticated_' + passno) !== 'true') {
                    window.location.replace("getEPass.jsp.html");
                    return;
                }
            })();

            // ── QR Code helper (works offline, no external image API) ───────
            function renderQR(text) {
                var container = document.getElementById('passQrCode');
                container.innerHTML = '';
                if (typeof QRCode !== 'undefined') {
                    new QRCode(container, {
                        text: text,
                        width: 80,
                        height: 80,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } else {
                    // Fallback: external API if qrcode.js didn't load
                    var img = document.createElement('img');
                    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=' + encodeURIComponent(text);
                    img.style.cssText = 'width:80px;height:80px;display:block;margin:0 auto;';
                    container.appendChild(img);
                }
            }

            // ── Session 5-Min Auto Logout Handler ───────────────────────
            (function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno') || '7502032600973';
                var sessionKey = 'pass_session_' + passno;
                var startTime = sessionStorage.getItem(sessionKey);
                
                if (!startTime) {
                    startTime = Date.now().toString();
                    sessionStorage.setItem(sessionKey, startTime);
                }
                
                var elapsed = Date.now() - parseInt(startTime);
                var limit = 5 * 60 * 1000; // 5 minutes in ms
                
                if (elapsed >= limit) {
                    sessionStorage.removeItem(sessionKey);
                    sessionStorage.removeItem('epass_authenticated_' + passno);
                    window.location.replace("getEPass.jsp.html");
                } else {
                    var remaining = limit - elapsed;
                    setTimeout(function() {
                        sessionStorage.removeItem(sessionKey);
                        sessionStorage.removeItem('epass_authenticated_' + passno);
                        window.location.replace("getEPass.jsp.html");
                    }, remaining);
                }
            })();

            (async function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno') || '7502032600973';
                var nameParam = urlParams.get('name')   || 'PAWAN KUMAR';
                var apiHost   = 'https://dtcpass-backend-api.onrender.com';

                // ── helpers ────────────────────────────────────────────────
                function setFallback() {
                    document.getElementById('blink').textContent   = passno;
                    document.getElementById('passName').textContent = nameParam.toUpperCase();
                    document.getElementById('passPhoto').src        = 'images/pawan.jpg';
                    var today  = new Date();
                    var toDate = new Date(); toDate.setDate(today.getDate() + 150);
                    var fmt    = function(d) { return d.toLocaleDateString('en-GB'); };
                    document.getElementById('passValidity').textContent =
                        'Valid from ' + fmt(today) + ' to ' + fmt(toDate);
                    renderQR(passno);

                    // Show pass and hide loading
                    document.getElementById('passLoading').style.display = 'none';
                    document.getElementById('passContainer').style.display = 'block';
                }

                try {
                    const ctrl     = new AbortController();
                    const timer    = setTimeout(function() { ctrl.abort(); }, 3000); // 3s timeout
                    const response = await fetch(apiHost + '/api/passes/' + passno + '?t=' + new Date().getTime(),
                                                 { signal: ctrl.signal });
                    clearTimeout(timer);

                    if (!response.ok) throw new Error('Pass not found');
                    const data = await response.json();

                    document.getElementById('blink').textContent    = data.passno;
                    document.getElementById('passName').textContent  = data.name;
                    document.getElementById('passPhoto').src         = data.photoUrl || 'images/pawan.jpg';
                    const fromDate = new Date(data.validFrom).toLocaleDateString('en-GB');
                    const toDate   = new Date(data.validTo).toLocaleDateString('en-GB');
                    document.getElementById('passValidity').textContent =
                        'Valid from ' + fromDate + ' to ' + toDate;
                    renderQR(data.passno);

                    // Dynamically update URL and passno variable if edited passno differs from URL parameter
                    if (passno !== data.passno) {
                        window.history.replaceState({}, '', '?passno=' + data.passno);
                    }

                    // Show pass and hide loading
                    document.getElementById('passLoading').style.display = 'none';
                    document.getElementById('passContainer').style.display = 'block';

                } catch (err) {
                    console.warn('API not available, using fallback:', err.message);
                    setFallback();
                }
            })();
        </script>
