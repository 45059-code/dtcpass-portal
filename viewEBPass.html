        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

        <script>
            // ── Instant Security Gate ──────────────────────────────────────────
            // Allows: (1) portal-login users via sessionStorage, (2) QR scans via #scan hash
            // Blocks: direct URL access → redirects to homepage (index.html)
            // WHY hash instead of ?qr=1:
            //   – Hash (#scan) is NEVER sent to the server, so Vercel routing is unaffected
            //   – history.replaceState wipes it BEFORE the browser paints the address bar
            //   – No server-side leakage or logging of a scan token
            (function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                // Detect QR scan via hash fragment (#scan) – never visible in address bar
                var isQrScan  = (window.location.hash === '#scan');

                // No passno at all → direct access, go to homepage
                if (!passno) {
                    window.location.replace('index.html');
                    return;
                }

                var isAuth = sessionStorage.getItem('epass_authenticated_' + passno) === 'true';

                // Already authenticated (portal login or prior QR scan in same session)
                if (isAuth) {
                    // Wipe the #scan hash so it never shows in the address bar
                    if (isQrScan) {
                        history.replaceState(null, '', '?passno=' + encodeURIComponent(passno));
                    }
                    return; // Allow access
                }

                // QR scan: always give a FRESH 5-min window (reset stale old timestamps)
                if (isQrScan) {
                    var scanKey = 'epass_scan_start_' + passno;
                    // Always stamp NOW – this prevents old expired timestamps from
                    // incorrectly blocking a brand-new scan attempt
                    localStorage.setItem(scanKey, Date.now().toString());
                    // Authenticate this scan session
                    sessionStorage.setItem('epass_authenticated_' + passno, 'true');
                    sessionStorage.setItem('epass_scan_mode_' + passno, '1');
                    // ✅ Wipe #scan from the URL bar instantly – clean URL only shows passno
                    history.replaceState(null, '', '?passno=' + encodeURIComponent(passno));
                    return; // Allow access
                }

                // No auth, no #scan hash → direct URL → redirect to homepage
                window.location.replace('index.html');
            })();
        </script>

        <!-- QR Code generator (no external image API needed) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script>
            // ── Logout Function (Clears all credentials and locks history) ───
            function logoutPass() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                if (passno) {
                    sessionStorage.removeItem('epass_authenticated_' + passno);
                    sessionStorage.removeItem('pass_session_' + passno);
                    sessionStorage.removeItem('epass_scan_mode_' + passno);
                    sessionStorage.removeItem('epass_data_' + passno);
                    localStorage.removeItem('epass_scan_start_' + passno);
                    localStorage.removeItem('last_pass_no');
                }
                // Clear any lingering session keys
                for (var i = sessionStorage.length - 1; i >= 0; i--) {
                    var k = sessionStorage.key(i);
                    if (k && (k.startsWith('epass_') || k.startsWith('pass_'))) {
                        sessionStorage.removeItem(k);
                    }
                }
                for (var j = 0; j < 10; j++) {
                    history.pushState(null, '', window.location.href);
                }
                window.location.replace('getEPass.jsp.html');
            }

            // ── Back-button & BFCache Protection ─────────────────────────────
            window.addEventListener('pageshow', function(event) {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                if (!passno) {
                    window.location.replace('index.html');
                    return;
                }
                var isScanMode = sessionStorage.getItem('epass_scan_mode_' + passno) === '1';
                if (isScanMode) {
                    var scanStart = localStorage.getItem('epass_scan_start_' + passno);
                    if (scanStart && (Date.now() - parseInt(scanStart)) >= 5 * 60 * 1000) {
                        var c = document.getElementById('passContainer');
                        if (c) c.style.display = 'none';
                        var l = document.getElementById('passLoading');
                        if (l) l.style.display = 'none';
                        localStorage.removeItem('epass_scan_start_' + passno);
                        sessionStorage.removeItem('epass_authenticated_' + passno);
                        sessionStorage.removeItem('epass_scan_mode_' + passno);
                        window.location.replace('index.html');
                    }
                }
            });

            window.addEventListener('popstate', function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                if (!passno) {
                    window.location.replace('index.html');
                }
            });

            // ── Note: Authentication already enforced by head IIFE gate above ─
            // No duplicate check needed here — removed to prevent blocking QR scans.

            // Photo display handled with strict freshness verification in main controller

            // ── QR Code helper (clean pass URL without extra query params) ────
            function renderQR(text, customQrUrl, passObj) {
                var container = document.getElementById('passQrCode');
                if (!container) return;
                container.innerHTML = '';
                if (customQrUrl) {
                    var img = document.createElement('img');
                    img.src = customQrUrl;
                    img.style.cssText = 'width:75px;height:75px;display:block;margin:0 auto;';
                    container.appendChild(img);
                    return;
                }
                var baseUrl = 'https://www.dtcepasdelhi.co.in';
                if (window.location.origin && !window.location.origin.includes('localhost') && !window.location.origin.includes('127.0.0.1')) {
                    baseUrl = window.location.origin;
                }
                // Append #scan hash – detected by security gate, wiped from URL bar instantly,
                // never sent to the server so Vercel routing is not affected
                var verificationUrl = baseUrl + '/viewEBPass?passno=' + encodeURIComponent(text) + '#scan';
                if (typeof QRCode !== 'undefined') {
                    new QRCode(container, {
                        text: verificationUrl,
                        width: 75,
                        height: 75,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } else {
                    // Fallback: external API if qrcode.js didn't load
                    var img = document.createElement('img');
                    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=75x75&data=' + encodeURIComponent(verificationUrl);
                    img.style.cssText = 'width:75px;height:75px;display:block;margin:0 auto;';
                    container.appendChild(img);
                }
            }

            // ── Session Timer (QR-Scan: 5 Min & Normal mode: 1 Hour) ─────
            // Timer runs SILENTLY in background — no visible countdown
            (function() {
                var urlParams  = new URLSearchParams(window.location.search);
                var passno     = urlParams.get('passno');
                if (!passno) return;
                var isScan = (sessionStorage.getItem('epass_scan_mode_' + passno) === '1');
                var limit  = isScan ? (5 * 60 * 1000) : (60 * 60 * 1000);

                // ── Use localStorage for scan mode so timer survives refresh ──
                var startTime;
                if (isScan) {
                    startTime = localStorage.getItem('epass_scan_start_' + passno);
                    if (!startTime) {
                        startTime = Date.now().toString();
                        localStorage.setItem('epass_scan_start_' + passno, startTime);
                    }
                } else {
                    var sessKey = 'pass_session_' + passno;
                    startTime = sessionStorage.getItem(sessKey);
                    if (!startTime) {
                        startTime = Date.now().toString();
                        sessionStorage.setItem(sessKey, startTime);
                    }
                }

                var elapsed = Date.now() - parseInt(startTime);

                function hardExpire() {
                    // Clean up all scan-related keys
                    localStorage.removeItem('epass_scan_start_' + passno);
                    sessionStorage.removeItem('pass_session_' + passno);
                    sessionStorage.removeItem('epass_authenticated_' + passno);
                    sessionStorage.removeItem('epass_scan_mode_' + passno);
                    // Block back-button
                    for (var i = 0; i < 10; i++) history.pushState(null, '', window.location.href);
                    // Session expired → go to homepage
                    window.location.replace('index.html');
                }

                if (elapsed >= limit) {
                    hardExpire();
                } else {
                    // Timer runs silently — no visible countdown banner
                    setTimeout(hardExpire, limit - elapsed);
                }
            })();

            (async function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                var nameParam   = urlParams.get('name')   || '';
                var mobileParam = urlParams.get('mobile') || '';
                var dobParam    = urlParams.get('dob')    || '';
                var vfParam     = urlParams.get('vf')     || '';
                var vtParam     = urlParams.get('vt')     || '';
                var catParam    = urlParams.get('cat')    || '';
                var pParam      = urlParams.get('p')      || '';
                var isOffline   = urlParams.get('offline') === '1';

                // Safety: if no passno and not offline/LOOKUP mode, redirect now
                if (!passno && !isOffline) {
                    window.location.replace('index.html');
                    return;
                }

                var apiHost   = 'https://dtcpass-backend-api.onrender.com';
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    apiHost = 'http://localhost:5000';
                }

                // ── Silent keep-alive pinger ───────────────────────────────
                // Pings /api/health every 13 minutes so Render never idles.
                // Shows NO UI — purely invisible background ping.
                (function startKeepalive() {
                    var PING_URL  = 'https://dtcpass-backend-api.onrender.com/api/health';
                    var PING_INTERVAL = 13 * 60 * 1000; // 13 min in ms
                    function silentPing() {
                        fetch(PING_URL, { method: 'GET', cache: 'no-store' })
                            .catch(function() {}); // Silently ignore errors
                    }
                    silentPing(); // Immediate ping on page load to wake backend
                    setInterval(silentPing, PING_INTERVAL);
                })();

                // ── helpers ────────────────────────────────────────────────
                var _passShown = false;
                function showPassCard() {
                    if (_passShown) return;
                    _passShown = true;
                    var l = document.getElementById('passLoading');
                    var c = document.getElementById('passContainer');
                    if (l) l.style.display = 'none';
                    if (c) c.style.display = 'block';
                }

                // ── Prevent stale photo cross-contamination ──────────────────────
                try { sessionStorage.removeItem('passPhotoCache'); } catch (_e) {}

                function displayPhoto(photoUrl, passno, forceUpdate) {
                    var photoEl = document.getElementById('passPhoto');
                    var wrapper = document.getElementById('photoWrapper');
                    if (!photoEl) return;

                    photoEl.referrerPolicy = 'no-referrer';

                    var cachedUrl  = localStorage.getItem('pass_photo_url_' + passno);
                    var cachedData = localStorage.getItem('pass_photo_local_' + passno);

                    // If forceUpdate or the URL has changed from what was cached, clear old cache
                    if (forceUpdate || (photoUrl && cachedUrl && cachedUrl !== photoUrl)) {
                        try {
                            localStorage.removeItem('pass_photo_local_' + passno);
                            localStorage.removeItem('pass_photo_url_' + passno);
                        } catch (_e) {}
                        cachedData = null;
                    }

                    if (cachedData && !forceUpdate) {
                        photoEl.src = cachedData;
                        photoEl.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                        return;
                    }

                    if (!photoUrl || photoUrl.trim() === '') {
                        photoEl.src = 'images/DTC1.png';
                        photoEl.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                        return;
                    }

                    // ⚡ INSTANT 0ms BASE64 DISPLAY (ZERO NETWORK LATENCY) ⚡
                    if (photoUrl.startsWith('data:')) {
                        photoEl.src = photoUrl;
                        photoEl.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                        try {
                            localStorage.setItem('pass_photo_local_' + passno, photoUrl);
                            localStorage.setItem('pass_photo_url_' + passno, 'data_uri');
                        } catch (_e) {}
                        return;
                    }

                    photoEl.onload = function() {
                        photoEl.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                        try {
                            var canvas = document.createElement('canvas');
                            canvas.width  = photoEl.naturalWidth || 250;
                            canvas.height = photoEl.naturalHeight || 250;
                            var ctx = canvas.getContext('2d');
                            ctx.drawImage(photoEl, 0, 0, canvas.width, canvas.height);
                            var dataURL = canvas.toDataURL('image/jpeg', 0.85);
                            localStorage.setItem('pass_photo_local_' + passno, dataURL);
                            localStorage.setItem('pass_photo_url_' + passno, photoUrl);
                        } catch (_e) {}
                    };

                    photoEl.onerror = function() {
                        this.onerror = null;
                        this.src = 'images/DTC1.png';
                        this.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                    };

                    photoEl.src = photoUrl;
                    if (photoEl.complete && photoEl.naturalWidth > 0) {
                        photoEl.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                    }
                }

                function renderPassData(data, isFresh) {
                    if (!data) return;

                    if (data.passno) document.getElementById('blink').textContent = data.passno;
                    if (data.name) document.getElementById('passName').textContent = data.name;
                    if (data.category) {
                        var catEl = document.getElementById('passCategory');
                        if (catEl) catEl.textContent = data.category;
                    }

                    if (data.validFrom && data.validTo) {
                        const fromDate = new Date(data.validFrom).toLocaleDateString('en-GB');
                        const toDate   = new Date(data.validTo).toLocaleDateString('en-GB');
                        document.getElementById('passValidity').textContent =
                            'Valid from ' + fromDate + ' to ' + toDate;
                    }
                    renderQR(data.passno, data.qrCodeUrl, data);

                    // ⚡ ULTRA-FAST INSTANT PASS DISPLAY (0.02 - 0.08s) ⚡
                    showPassCard();
                    displayPhoto(data.photoUrl, data.passno, isFresh);
                }

                function setFallback() {
                    document.getElementById('blink').textContent   = passno.startsWith('LOOKUP_') ? ('Mobile: ' + mobileParam) : passno;
                    document.getElementById('passName').textContent = nameParam.toUpperCase() || 'USER';
                    
                    displayPhoto('', passno, false);

                    var today  = new Date();
                    var toDate = new Date(); toDate.setDate(today.getDate() + 150);
                    var fmt    = function(d) { return d.toLocaleDateString('en-GB'); };
                    var validityText;
                    if (dobParam) {
                        validityText = 'Mobile: ' + mobileParam + ' | DOB: ' + dobParam;
                    } else {
                        validityText = 'Valid from ' + fmt(today) + ' to ' + fmt(toDate);
                    }
                    document.getElementById('passValidity').textContent = validityText;
                    if (!passno.startsWith('LOOKUP_')) {
                        renderQR(passno, null, { passno: passno, name: nameParam });
                    }

                    showPassCard();
                }

                // ── Intelligent Cache & Mode Handling ───────────────────────────
                // Portal Login / Registration: If user just verified details in getEPass.jsp.html,
                // render their pass data instantly without waiting for network.
                // QR Scan Mode: Purge stale cache so QR scans never flash old validity dates.
                var isScanMode = (sessionStorage.getItem('epass_scan_mode_' + passno) === '1');
                var cachedData = null;

                if (!isScanMode) {
                    try {
                        var rawCached = sessionStorage.getItem('epass_data_' + passno);
                        if (rawCached) {
                            cachedData = JSON.parse(rawCached);
                        }
                    } catch (_e) {}
                    if (cachedData && cachedData.passno) {
                        renderPassData(cachedData, false);
                    }
                } else {
                    // QR scan mode: strictly purge cached data to prevent stale date flashes
                    try { sessionStorage.removeItem('epass_data_' + passno); } catch(_){}
                    try { localStorage.removeItem('epass_persistent_' + passno); } catch(_){}
                }

                // Offline / LOOKUP mode — show fallback immediately (no API available)
                if (isOffline || passno.startsWith('LOOKUP_')) {
                    if (nameParam || vfParam) {
                        var immediatePassData = {
                            passno: passno,
                            name: nameParam,
                            validFrom: vfParam || new Date().toISOString(),
                            validTo: vtParam || new Date(Date.now() + 150 * 86400000).toISOString(),
                            category: catParam || 'Student All route AC/Non AC',
                            photoUrl: pParam || ''
                        };
                        renderPassData(immediatePassData, false);
                    } else {
                        setFallback();
                    }
                    return;
                }

                // ── Active verification loop ─────────────────────────────────
                var _retryTimer = null;
                var _maxRetries = 20;
                var _attempt    = 0;

                // ── 3-Layer Secure Vault In-Memory Decryption ──────────────
                function _decodePassVault(vaultData) {
                    try {
                        var enc = (vaultData && vaultData.vault) ? vaultData.vault : (typeof vaultData === 'string' ? vaultData : null);
                        if (!enc) return null;
                        var binStr = atob(enc);
                        var len = binStr.length;
                        var _s = String.fromCharCode;
                        var _p1 = [68,84,67,64,83,69,67,57,57,35].map(function(c){return _s(c);}).join('');
                        var _p2 = [80,79,82,84,65,76,36,86,65,85,76,84,33,50,48,50,54].map(function(c){return _s(c);}).join('');
                        var key = _p1 + _p2;
                        var klen = key.length;
                        var out = new Uint8Array(len);
                        for (var i = 0; i < len; i++) {
                            var b = binStr.charCodeAt(len - 1 - i);
                            var shifted = (b - 47 + 256) % 256;
                            var k = key.charCodeAt(i % klen);
                            out[i] = (shifted ^ k);
                        }
                        var decStr = new TextDecoder('utf-8').decode(out);
                        var obj = JSON.parse(decStr);
                        return obj && obj.passes ? obj.passes : (Array.isArray(obj) ? obj : []);
                    } catch (e) {
                        return null;
                    }
                }

                // In-memory vault pass loader (prepared concurrently as fallback, never rendered prematurely)
                async function _loadVaultPass() {
                    try {
                        var staticResp = await fetch('/passes.json?t=' + Date.now(), { cache: 'no-store' });
                        if (staticResp && staticResp.ok) {
                            var staticJson = await staticResp.json();
                            var passList = _decodePassVault(staticJson);
                            if (!passList) {
                                passList = Array.isArray(staticJson) ? staticJson : (staticJson.passes || []);
                            }
                            return passList.find(function(p) { return String(p.passno) === String(passno); }) || null;
                        }
                    } catch (_staticErr) {}
                    return null;
                }

                async function _fetchPass() {
                    _attempt++;

                    // 1️⃣ Priority: Fetch live API directly (authoritative source of truth)
                    // The loading spinner remains visible while live API responds (typically 200-400ms).
                    // This eliminates ANY millisecond date switching or stale cache flashing.
                    var apiPromise = (async function() {
                        try {
                            var ctrl = new AbortController();
                            var timer = setTimeout(function() { ctrl.abort(); }, 2500);
                            var resp = await fetch(apiHost + '/api/passes/' + passno + '?t=' + Date.now(),
                                                   { signal: ctrl.signal, cache: 'no-store' });
                            clearTimeout(timer);
                            if (resp && resp.ok) {
                                var data = await resp.json();
                                if (data && data.passno) return data;
                            }
                        } catch (_e1) {}

                        if (apiHost !== 'https://dtcpass-backend-api.onrender.com') {
                            try {
                                var ctrl2 = new AbortController();
                                var timer2 = setTimeout(function() { ctrl2.abort(); }, 2500);
                                var resp2 = await fetch('https://dtcpass-backend-api.onrender.com/api/passes/' + passno + '?t=' + Date.now(),
                                                        { signal: ctrl2.signal, cache: 'no-store' });
                                clearTimeout(timer2);
                                if (resp2 && resp2.ok) {
                                    var data2 = await resp2.json();
                                    if (data2 && data2.passno) return data2;
                                }
                            } catch (_e2) {}
                        }
                        return null;
                    })();

                    // Start vault fetch concurrently in memory so fallback is ready instantly if API is slow
                    var vaultPromise = _loadVaultPass();

                    // Wait for live API (authoritative fresh data)
                    var apiData = await apiPromise;

                    if (apiData && apiData.passno) {
                        cachedData = apiData;
                        renderPassData(apiData, true);
                        try {
                            sessionStorage.setItem('epass_data_' + apiData.passno, JSON.stringify(apiData));
                            localStorage.setItem('epass_persistent_' + apiData.passno, JSON.stringify(apiData));
                        } catch (_ce) {}
                        if (passno !== apiData.passno) {
                            window.history.replaceState({}, '', '?passno=' + apiData.passno);
                        }
                        return; // Done with authoritative live data!
                    }

                    // 2️⃣ Fallback: If live API was unreachable or timed out (>2.5s), use vault
                    var matchedVault = await vaultPromise;
                    if (matchedVault) {
                        cachedData = matchedVault;
                        renderPassData(matchedVault, true);
                        try {
                            sessionStorage.setItem('epass_data_' + matchedVault.passno, JSON.stringify(matchedVault));
                            localStorage.setItem('epass_persistent_' + matchedVault.passno, JSON.stringify(matchedVault));
                        } catch (_ce) {}

                        // Background check: if live backend wakes up later, verify and update
                        (async function verifyLiveInBackground() {
                            try {
                                var ctrlB = new AbortController();
                                var timerB = setTimeout(function() { ctrlB.abort(); }, 8000);
                                var respB = await fetch('https://dtcpass-backend-api.onrender.com/api/passes/' + passno + '?t=' + Date.now(),
                                                        { signal: ctrlB.signal, cache: 'no-store' });
                                clearTimeout(timerB);
                                if (respB && respB.ok) {
                                    var liveB = await respB.json();
                                    if (liveB && liveB.passno) {
                                        var differs = !cachedData ||
                                            cachedData.name !== liveB.name ||
                                            cachedData.validFrom !== liveB.validFrom ||
                                            cachedData.validTo !== liveB.validTo ||
                                            cachedData.photoUrl !== liveB.photoUrl ||
                                            cachedData.category !== liveB.category ||
                                            (liveB.updatedAt && cachedData.updatedAt !== liveB.updatedAt);
                                        if (differs) {
                                            cachedData = liveB;
                                            renderPassData(liveB, true);
                                            try {
                                                sessionStorage.setItem('epass_data_' + liveB.passno, JSON.stringify(liveB));
                                                localStorage.setItem('epass_persistent_' + liveB.passno, JSON.stringify(liveB));
                                            } catch (_ce) {}
                                        }
                                    }
                                }
                            } catch (_bgErr) {}
                        })();
                        return;
                    }

                    // Neither responded yet — retry silently
                    if (_attempt < _maxRetries) {
                        _retryTimer = setTimeout(_fetchPass, 4000);
                    }
                }

                _fetchPass();
            })();
        </script>
