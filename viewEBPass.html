        <!-- QR Code generator (no external image API needed) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script>
            // ── Instant Photo Pre-load from Cache (runs immediately on scan) ──
            (function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                if (!passno) return;
                // Try to show cached photo BEFORE any API call so photo is instant
                var cachedPhoto = localStorage.getItem('pass_photo_local_' + passno);
                if (cachedPhoto) {
                    var photoEl = document.getElementById('passPhoto');
                    if (photoEl) {
                        photoEl.src = cachedPhoto;
                        photoEl.style.display = 'block';
                        var wrapper = document.getElementById('photoWrapper');
                        if (wrapper) wrapper.classList.add('loaded');
                    }
                }
                // Also try passPhotoCache (sessionStorage fallback)
                if (!cachedPhoto) {
                    var sessPhoto = sessionStorage.getItem('passPhotoCache');
                    if (sessPhoto) {
                        var photoEl2 = document.getElementById('passPhoto');
                        if (photoEl2) {
                            photoEl2.src = sessPhoto;
                            photoEl2.style.display = 'block';
                            var wrapper2 = document.getElementById('photoWrapper');
                            if (wrapper2) wrapper2.classList.add('loaded');
                        }
                    }
                }
            })();

            // ── Dynamic Passno Resolution and Auto Redirect ──────────────────
            (async function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                
                // If passno is present, we do not need to redirect
                if (passno) {
                    return;
                }

                // If passno is missing, try to resolve it
                var resolvedPassNo = localStorage.getItem('last_pass_no');
                
                // If not in localStorage, fetch the latest pass from the backend
                if (!resolvedPassNo) {
                    var apiHost = 'https://dtcpass-backend-api.onrender.com';
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        apiHost = 'http://localhost:5000';
                    }
                    try {
                        var ctrl = new AbortController();
                        var timer = setTimeout(function() { ctrl.abort(); }, 3000);
                        var response = await fetch(apiHost + '/api/passes?t=' + Date.now(), { signal: ctrl.signal });
                        clearTimeout(timer);
                        if (response.ok) {
                            var passes = await response.json();
                            if (passes && passes.length > 0) {
                                resolvedPassNo = passes[0].passno; // latest pass
                            }
                        }
                    } catch (e) {
                        console.warn('Failed to fetch passes from backend:', e);
                    }
                }

                // No pass found — send user to the lookup page instead of showing demo pass
                if (!resolvedPassNo) {
                    window.location.replace('getEPass.jsp.html');
                    return;
                }

                // Store in localStorage for future use
                localStorage.setItem('last_pass_no', resolvedPassNo);
                
                // Authenticate the session for this pass to avoid redirect loops
                sessionStorage.setItem('epass_authenticated_' + resolvedPassNo, 'true');

                // Redirect using replace() so the parameter-less URL is replaced in history
                var newSearch = new URLSearchParams(window.location.search);
                newSearch.set('passno', resolvedPassNo);
                window.location.replace(window.location.pathname + '?' + newSearch.toString());
            })();

            // ── Session / QR-Scan Authentication Check ──────────────────────
            (function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                var isScan    = urlParams.get('scan') === '1';
                var isOffline = urlParams.get('offline') === '1';

                // No passno at all — redirect to lookup page immediately
                if (!passno) {
                    window.location.replace('getEPass.jsp.html');
                    return;
                }

                // QR-scan mode: allow direct access without session auth
                // Record scan start in localStorage so refresh WITHIN 5 min stays open
                if (isScan) {
                    sessionStorage.setItem('epass_scan_mode_' + passno, '1');
                    // Only record start time if not already set (don't reset on each scan=1)
                    if (!localStorage.getItem('epass_scan_start_' + passno)) {
                        localStorage.setItem('epass_scan_start_' + passno, Date.now().toString());
                    }
                    // Remove ?scan=1 from the address bar so it stays clean
                    var cleanParams = new URLSearchParams(window.location.search);
                    cleanParams.delete('scan');
                    var cleanUrl = window.location.pathname + '?' + cleanParams.toString();
                    window.history.replaceState({}, '', cleanUrl);
                    return; // ✅ allow the page to load
                }

                // ── Refresh within 5-min scan window → restore access ─────────
                // If this passno was scanned recently (within 5 min), allow access
                // without needing scan=1 in URL again (survives page refresh)
                var _scanStart = localStorage.getItem('epass_scan_start_' + passno);
                if (_scanStart && (Date.now() - parseInt(_scanStart)) < 5 * 60 * 1000) {
                    sessionStorage.setItem('epass_scan_mode_' + passno, '1'); // restore flag
                    return; // ✅ still within 5-min scan window
                }

                // Offline mode: allow direct access (backend was unreachable)
                if (isOffline) {
                    return; // ✅ allow the page to load
                }

                // LOOKUP_ passno (offline mobile+dob lookup) — allow
                if (passno.startsWith('LOOKUP_')) {
                    return; // ✅ allow the page to load
                }

                // Normal (non-scan) mode: require session auth
                if (sessionStorage.getItem('epass_authenticated_' + passno) !== 'true') {
                    window.location.replace("getEPass.jsp.html");
                    return;
                }
            })();

            // ── QR Code helper (scan=1 flag makes it scanner-friendly) ────
            function renderQR(text, customQrUrl) {
                var container = document.getElementById('passQrCode');
                container.innerHTML = '';
                if (customQrUrl) {
                    var img = document.createElement('img');
                    img.src = customQrUrl;
                    img.style.cssText = 'width:75px;height:75px;display:block;margin:0 auto;';
                    container.appendChild(img);
                    return;
                }
                // scan=1 → scanner devices bypass auth and get direct 5-min session
                // Use window.location.origin so it works on localhost AND production
                var verificationUrl = window.location.origin + '/viewEBPass.html?passno=' + encodeURIComponent(text) + '&scan=1';
                if (typeof QRCode !== 'undefined') {
                    new QRCode(container, {
                        text: verificationUrl,
                        width: 75,
                        height: 75,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } else {
                    // Fallback: external API if qrcode.js didn't load
                    var img = document.createElement('img');
                    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=75x75&data=' + encodeURIComponent(verificationUrl);
                    img.style.cssText = 'width:75px;height:75px;display:block;margin:0 auto;';
                    container.appendChild(img);
                }
            }

            // ── Session Timer (QR-Scan: 5 Min & Normal mode: 1 Hour) ─────
            // Timer runs SILENTLY in background — no visible countdown
            (function() {
                var urlParams  = new URLSearchParams(window.location.search);
                var passno     = urlParams.get('passno');
                if (!passno) return;
                var isScan = (sessionStorage.getItem('epass_scan_mode_' + passno) === '1');
                var limit  = isScan ? (5 * 60 * 1000) : (60 * 60 * 1000);

                // ── Use localStorage for scan mode so timer survives refresh ──
                var startTime;
                if (isScan) {
                    startTime = localStorage.getItem('epass_scan_start_' + passno);
                    if (!startTime) {
                        startTime = Date.now().toString();
                        localStorage.setItem('epass_scan_start_' + passno, startTime);
                    }
                } else {
                    var sessKey = 'pass_session_' + passno;
                    startTime = sessionStorage.getItem(sessKey);
                    if (!startTime) {
                        startTime = Date.now().toString();
                        sessionStorage.setItem(sessKey, startTime);
                    }
                }

                var elapsed = Date.now() - parseInt(startTime);

                function hardExpire() {
                    // Clean up all scan-related keys
                    localStorage.removeItem('epass_scan_start_' + passno);
                    sessionStorage.removeItem('pass_session_' + passno);
                    sessionStorage.removeItem('epass_authenticated_' + passno);
                    sessionStorage.removeItem('epass_scan_mode_' + passno);
                    // Block back-button
                    for (var i = 0; i < 10; i++) history.pushState(null, '', window.location.href);
                    window.location.replace(isScan ? 'https://dtcpass.delhi.gov.in/' : 'getEPass.jsp.html');
                }

                if (elapsed >= limit) {
                    hardExpire();
                } else {
                    // Timer runs silently — no visible countdown banner
                    setTimeout(hardExpire, limit - elapsed);
                }
            })();

            (async function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                var nameParam   = urlParams.get('name')   || '';
                var mobileParam = urlParams.get('mobile') || '';
                var dobParam    = urlParams.get('dob')    || '';
                var isOffline   = urlParams.get('offline') === '1';

                // Safety: if no passno and not offline/LOOKUP mode, redirect now
                if (!passno && !isOffline) {
                    window.location.replace('getEPass.jsp.html');
                    return;
                }

                var apiHost   = 'https://dtcpass-backend-api.onrender.com';
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    apiHost = 'http://localhost:5000';
                }

                // ── Silent keep-alive pinger ───────────────────────────────
                // Pings /api/health every 13 minutes so Render never idles.
                // Shows NO UI — purely invisible background ping.
                (function startKeepalive() {
                    var PING_URL  = 'https://dtcpass-backend-api.onrender.com/api/health';
                    var PING_INTERVAL = 13 * 60 * 1000; // 13 min in ms
                    function silentPing() {
                        fetch(PING_URL, { method: 'GET', cache: 'no-store' })
                            .catch(function() {}); // Silently ignore errors
                    }
                    silentPing(); // Immediate ping on page load to wake backend
                    setInterval(silentPing, PING_INTERVAL);
                })();

                // ── helpers ────────────────────────────────────────────────
                function renderPassData(data) {
                    document.getElementById('blink').textContent    = data.passno;
                    document.getElementById('passName').textContent  = data.name;

                    var photoEl = document.getElementById('passPhoto');
                    photoEl.onerror = function() {
                        this.onerror = null;
                        this.src = 'images/DTC1.png';
                        this.style.display = 'block';
                        var w = document.getElementById('photoWrapper');
                        if (w) w.classList.add('loaded');
                    };

                    // ── Instant photo from cache (no network wait) ──────────
                    var cachedPhoto = localStorage.getItem('pass_photo_local_' + data.passno);
                    if (cachedPhoto) {
                        // Already pre-loaded; just ensure element is correct & visible
                        if (photoEl.getAttribute('src') !== cachedPhoto) photoEl.src = cachedPhoto;
                        photoEl.style.display = 'block';
                        var w0 = document.getElementById('photoWrapper');
                        if (w0) w0.classList.add('loaded');
                    } else if (data.photoUrl && data.photoUrl.trim() !== '') {
                        // No cache — load from URL in background, then cache at 250×250
                        // Start loading IMMEDIATELY (parallel to rest of render)
                        var newImg = new Image();
                        newImg.crossOrigin = 'anonymous';
                        newImg.referrerPolicy = 'no-referrer';
                        newImg.onload = function() {
                            photoEl.src = newImg.src;
                            photoEl.style.display = 'block';
                            var w1 = document.getElementById('photoWrapper');
                            if (w1) w1.classList.add('loaded');
                            // Cache resized to exactly 250×250 at quality 0.75
                            // so next scan loads from localStorage instantly (small file)
                            try {
                                var canvas = document.createElement('canvas');
                                canvas.width  = 250;
                                canvas.height = 250;
                                var ctx = canvas.getContext('2d');
                                ctx.drawImage(newImg, 0, 0, 250, 250);
                                var dataURL = canvas.toDataURL('image/jpeg', 0.75);
                                localStorage.setItem('pass_photo_local_' + data.passno, dataURL);
                                sessionStorage.setItem('passPhotoCache', dataURL);
                            } catch (e) {
                                // CORS blocked canvas — still show the image URL
                                console.warn('Photo cache skipped (CORS):', e);
                            }
                        };
                        newImg.onerror = function() {
                            photoEl.src = 'images/DTC1.png';
                            photoEl.style.display = 'block';
                            var w2 = document.getElementById('photoWrapper');
                            if (w2) w2.classList.add('loaded');
                        };
                        newImg.src = data.photoUrl;
                    } else {
                        photoEl.src = 'images/DTC1.png';
                        photoEl.style.display = 'block';
                        var w3 = document.getElementById('photoWrapper');
                        if (w3) w3.classList.add('loaded');
                    }

                    photoEl.referrerPolicy = 'no-referrer';
                    const fromDate = new Date(data.validFrom).toLocaleDateString('en-GB');
                    const toDate   = new Date(data.validTo).toLocaleDateString('en-GB');
                    document.getElementById('passValidity').textContent =
                        'Valid from ' + fromDate + ' to ' + toDate;
                    renderQR(data.passno, data.qrCodeUrl);

                    // Show pass and hide loading — photo may still be loading
                    // but name/passno/validity are ready; skeleton handles photo
                    document.getElementById('passLoading').style.display = 'none';
                    document.getElementById('passContainer').style.display = 'block';
                }

                function setFallback() {
                    document.getElementById('blink').textContent   = passno.startsWith('LOOKUP_') ? ('Mobile: ' + mobileParam) : passno;
                    document.getElementById('passName').textContent = nameParam.toUpperCase() || 'USER';
                    
                    var photoEl = document.getElementById('passPhoto');
                    var cachedPhoto = localStorage.getItem('pass_photo_local_' + passno);
                    if (cachedPhoto) {
                        photoEl.src = cachedPhoto;
                    } else {
                        photoEl.src = 'images/DTC1.png';
                    }
                    var today  = new Date();
                    var toDate = new Date(); toDate.setDate(today.getDate() + 150);
                    var fmt    = function(d) { return d.toLocaleDateString('en-GB'); };
                    var validityText;
                    if (dobParam) {
                        validityText = 'Mobile: ' + mobileParam + ' | DOB: ' + dobParam;
                    } else {
                        validityText = 'Valid from ' + fmt(today) + ' to ' + fmt(toDate);
                    }
                    document.getElementById('passValidity').textContent = validityText;
                    if (!passno.startsWith('LOOKUP_')) {
                        renderQR(passno, null);
                    }

                    // Show pass and hide loading
                    document.getElementById('passLoading').style.display = 'none';
                    document.getElementById('passContainer').style.display = 'block';
                }

                // Try to load cached data first (sessionStorage = current tab, localStorage = persistent)
                var cachedData = null;
                try {
                    var rawCached = sessionStorage.getItem('epass_data_' + passno);
                    if (rawCached) {
                        cachedData = JSON.parse(rawCached);
                    }
                } catch (e) {
                    console.warn('Error reading from sessionStorage:', e);
                }

                // Also check localStorage persistent cache (survives tab/browser restart)
                if (!cachedData) {
                    try {
                        var rawPersistent = localStorage.getItem('epass_persistent_' + passno);
                        if (rawPersistent) {
                            cachedData = JSON.parse(rawPersistent);
                        }
                    } catch (e) {
                        console.warn('Error reading from localStorage:', e);
                    }
                }

                // If we have cached data, show it immediately while fetching fresh data in background
                if (cachedData) {
                    renderPassData(cachedData);
                }

                // Offline / LOOKUP mode — cached data already shown above, nothing more to do
                if (isOffline || passno.startsWith('LOOKUP_')) {
                    return;
                }

                // ── Silent retry loop ─────────────────────────────────────────
                // Keeps the spinner visible and retries every 8 s until the
                // backend wakes up and returns real data. Nothing is ever shown
                // on screen while waiting — only the loading spinner.
                var _retryTimer = null;
                var _maxRetries = 20; // 20 × 8 s = ~2.7 min max wait
                var _attempt    = 0;

                async function _fetchPass() {
                    _attempt++;
                    var data = null;

                    // 1️⃣ Try local/Render API
                    try {
                        var ctrl  = new AbortController();
                        var timer = setTimeout(function() { ctrl.abort(); }, 10000);
                        var resp  = await fetch(apiHost + '/api/passes/' + passno + '?t=' + Date.now(),
                                               { signal: ctrl.signal });
                        clearTimeout(timer);
                        if (resp && resp.ok) {
                            data = await resp.json();
                        }
                    } catch (_e1) {}

                    // 2️⃣ Fallback to Render cloud if local didn't work
                    if (!data && apiHost !== 'https://dtcpass-backend-api.onrender.com') {
                        try {
                            var ctrl2  = new AbortController();
                            var timer2 = setTimeout(function() { ctrl2.abort(); }, 12000);
                            var resp2  = await fetch('https://dtcpass-backend-api.onrender.com/api/passes/' + passno + '?t=' + Date.now(),
                                                    { signal: ctrl2.signal });
                            clearTimeout(timer2);
                            if (resp2 && resp2.ok) {
                                data = await resp2.json();
                            }
                        } catch (_e2) {}
                    }

                    if (data) {
                        // ✅ Got real data — render pass and update caches
                        renderPassData(data);
                        try {
                            sessionStorage.setItem('epass_data_' + data.passno, JSON.stringify(data));
                            localStorage.setItem('epass_persistent_' + data.passno, JSON.stringify(data));
                        } catch (_ce) {}
                        if (passno !== data.passno) {
                            window.history.replaceState({}, '', '?passno=' + data.passno);
                        }
                        return; // Done — do NOT schedule another retry
                    }

                    // ❌ No data yet — keep spinner visible and retry silently
                    if (_attempt < _maxRetries) {
                        _retryTimer = setTimeout(_fetchPass, 8000);
                    }
                    // If max retries exhausted: spinner stays visible with no extra message.
                    // User can reload the page manually.
                }

                _fetchPass();
            })();
        </script>
    </body>
