        <script>
            // ── Logout Function (Clears all credentials and locks history) ───
            function logoutPass() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                if (passno) {
                    sessionStorage.removeItem('epass_authenticated_' + passno);
                    sessionStorage.removeItem('pass_session_' + passno);
                    sessionStorage.removeItem('epass_scan_mode_' + passno);
                    sessionStorage.removeItem('epass_data_' + passno);
                    localStorage.removeItem('epass_scan_start_' + passno);
                    localStorage.removeItem('last_pass_no');
                }
                // Clear any lingering session keys
                for (var i = sessionStorage.length - 1; i >= 0; i--) {
                    var k = sessionStorage.key(i);
                    if (k && (k.startsWith('epass_') || k.startsWith('pass_'))) {
                        sessionStorage.removeItem(k);
                    }
                }
                for (var j = 0; j < 10; j++) {
                    history.pushState(null, '', window.location.href);
                }
                window.location.replace('getEPass.jsp.html');
            }

            // ── Back-button & BFCache Protection ─────────────────────────────
            window.addEventListener('pageshow', function(event) {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                if (!passno) {
                    window.location.replace('getEPass.jsp.html');
                    return;
                }
                var isScan      = (sessionStorage.getItem('epass_scan_mode_' + passno) === '1');
                var scanStart   = localStorage.getItem('epass_scan_start_' + passno);
                var isScanValid = isScan && scanStart && (Date.now() - parseInt(scanStart)) < 5 * 60 * 1000;
                var isAuth      = (sessionStorage.getItem('epass_authenticated_' + passno) === 'true');

                if (!isScanValid && !isAuth) {
                    var c = document.getElementById('passContainer');
                    if (c) c.style.display = 'none';
                    var l = document.getElementById('passLoading');
                    if (l) l.style.display = 'none';
                    window.location.replace('getEPass.jsp.html');
                }
            });

            window.addEventListener('popstate', function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                if (!passno || sessionStorage.getItem('epass_authenticated_' + passno) !== 'true') {
                    window.location.replace('getEPass.jsp.html');
                }
            });

            // ── Strict Authentication & Security Check ───────────────────────
            (function enforceAuthentication() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                var isScan    = urlParams.get('scan') === '1';

                // No passno -> Direct access blocked
                if (!passno) {
                    window.location.replace('getEPass.jsp.html');
                    return;
                }

                // QR Scan Mode (5-min session)
                if (isScan) {
                    sessionStorage.setItem('epass_scan_mode_' + passno, '1');
                    if (!localStorage.getItem('epass_scan_start_' + passno)) {
                        localStorage.setItem('epass_scan_start_' + passno, Date.now().toString());
                    }
                    var cleanParams = new URLSearchParams(window.location.search);
                    cleanParams.delete('scan');
                    var cleanUrl = window.location.pathname + '?' + cleanParams.toString();
                    window.history.replaceState({}, '', cleanUrl);
                    return;
                }

                var scanStart = localStorage.getItem('epass_scan_start_' + passno);
                if (scanStart && (Date.now() - parseInt(scanStart)) < 5 * 60 * 1000) {
                    sessionStorage.setItem('epass_scan_mode_' + passno, '1');
                    return;
                }

                // Normal Mode: Must be explicitly authenticated in this session
                if (sessionStorage.getItem('epass_authenticated_' + passno) !== 'true') {
                    // Blocked! Direct URL access without login is forbidden
                    window.location.replace('getEPass.jsp.html');
                    return;
                }
            })();

            // ── Instant Photo Pre-load from Cache ─────────────────────────────
            (function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                if (!passno) return;
                var cachedPhoto = localStorage.getItem('pass_photo_local_' + passno) || sessionStorage.getItem('passPhotoCache');
                if (cachedPhoto) {
                    var photoEl = document.getElementById('passPhoto');
                    if (photoEl) {
                        photoEl.src = cachedPhoto;
                        photoEl.style.display = 'block';
                        var wrapper = document.getElementById('photoWrapper');
                        if (wrapper) wrapper.classList.add('loaded');
                    }
                }
            })();

            // ── QR Code helper (scan=1 flag makes it scanner-friendly) ────
            function renderQR(text, customQrUrl, passObj) {
                var container = document.getElementById('passQrCode');
                if (!container) return;
                container.innerHTML = '';
                if (customQrUrl) {
                    var img = document.createElement('img');
                    img.src = customQrUrl;
                    img.style.cssText = 'width:75px;height:75px;display:block;margin:0 auto;';
                    container.appendChild(img);
                    return;
                }
                var params = new URLSearchParams();
                params.set('passno', text);
                params.set('scan', '1');
                if (passObj) {
                    if (passObj.name) params.set('name', passObj.name);
                    if (passObj.validFrom) params.set('vf', passObj.validFrom);
                    if (passObj.validTo) params.set('vt', passObj.validTo);
                    if (passObj.category) params.set('cat', passObj.category);
                    if (passObj.photoUrl && passObj.photoUrl.length < 600) params.set('p', passObj.photoUrl);
                }
                var verificationUrl = window.location.origin + '/viewEBPass.html?' + params.toString();
                if (typeof QRCode !== 'undefined') {
                    new QRCode(container, {
                        text: verificationUrl,
                        width: 75,
                        height: 75,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } else {
                    // Fallback: external API if qrcode.js didn't load
                    var img = document.createElement('img');
                    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=75x75&data=' + encodeURIComponent(verificationUrl);
                    img.style.cssText = 'width:75px;height:75px;display:block;margin:0 auto;';
                    container.appendChild(img);
                }
            }

            // ── Session Timer (QR-Scan: 5 Min & Normal mode: 1 Hour) ─────
            // Timer runs SILENTLY in background — no visible countdown
            (function() {
                var urlParams  = new URLSearchParams(window.location.search);
                var passno     = urlParams.get('passno');
                if (!passno) return;
                var isScan = (sessionStorage.getItem('epass_scan_mode_' + passno) === '1');
                var limit  = isScan ? (5 * 60 * 1000) : (60 * 60 * 1000);

                // ── Use localStorage for scan mode so timer survives refresh ──
                var startTime;
                if (isScan) {
                    startTime = localStorage.getItem('epass_scan_start_' + passno);
                    if (!startTime) {
                        startTime = Date.now().toString();
                        localStorage.setItem('epass_scan_start_' + passno, startTime);
                    }
                } else {
                    var sessKey = 'pass_session_' + passno;
                    startTime = sessionStorage.getItem(sessKey);
                    if (!startTime) {
                        startTime = Date.now().toString();
                        sessionStorage.setItem(sessKey, startTime);
                    }
                }

                var elapsed = Date.now() - parseInt(startTime);

                function hardExpire() {
                    // Clean up all scan-related keys
                    localStorage.removeItem('epass_scan_start_' + passno);
                    sessionStorage.removeItem('pass_session_' + passno);
                    sessionStorage.removeItem('epass_authenticated_' + passno);
                    sessionStorage.removeItem('epass_scan_mode_' + passno);
                    // Block back-button
                    for (var i = 0; i < 10; i++) history.pushState(null, '', window.location.href);
                    window.location.replace(isScan ? 'https://dtcpass.delhi.gov.in/' : 'getEPass.jsp.html');
                }

                if (elapsed >= limit) {
                    hardExpire();
                } else {
                    // Timer runs silently — no visible countdown banner
                    setTimeout(hardExpire, limit - elapsed);
                }
            })();

            (async function() {
                var urlParams = new URLSearchParams(window.location.search);
                var passno    = urlParams.get('passno');
                var nameParam   = urlParams.get('name')   || '';
                var mobileParam = urlParams.get('mobile') || '';
                var dobParam    = urlParams.get('dob')    || '';
                var vfParam     = urlParams.get('vf')     || '';
                var vtParam     = urlParams.get('vt')     || '';
                var catParam    = urlParams.get('cat')    || '';
                var pParam      = urlParams.get('p')      || '';
                var isOffline   = urlParams.get('offline') === '1';

                // Safety: if no passno and not offline/LOOKUP mode, redirect now
                if (!passno && !isOffline) {
                    window.location.replace('getEPass.jsp.html');
                    return;
                }

                var apiHost   = 'https://dtcpass-backend-api.onrender.com';
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    apiHost = 'http://localhost:5000';
                }

                // ── Silent keep-alive pinger ───────────────────────────────
                // Pings /api/health every 13 minutes so Render never idles.
                // Shows NO UI — purely invisible background ping.
                (function startKeepalive() {
                    var PING_URL  = 'https://dtcpass-backend-api.onrender.com/api/health';
                    var PING_INTERVAL = 13 * 60 * 1000; // 13 min in ms
                    function silentPing() {
                        fetch(PING_URL, { method: 'GET', cache: 'no-store' })
                            .catch(function() {}); // Silently ignore errors
                    }
                    silentPing(); // Immediate ping on page load to wake backend
                    setInterval(silentPing, PING_INTERVAL);
                })();

                // ── helpers ────────────────────────────────────────────────
                var _passShown = false;
                function showPassCard() {
                    if (_passShown) return;
                    _passShown = true;
                    var l = document.getElementById('passLoading');
                    var c = document.getElementById('passContainer');
                    if (l) l.style.display = 'none';
                    if (c) c.style.display = 'block';
                }

                function renderPassData(data) {
                    if (!data) return;

                    if (data.passno) document.getElementById('blink').textContent = data.passno;
                    if (data.name) document.getElementById('passName').textContent = data.name;
                    if (data.category) {
                        var catEl = document.getElementById('passCategory');
                        if (catEl) catEl.textContent = data.category;
                    }

                    if (data.validFrom && data.validTo) {
                        const fromDate = new Date(data.validFrom).toLocaleDateString('en-GB');
                        const toDate   = new Date(data.validTo).toLocaleDateString('en-GB');
                        document.getElementById('passValidity').textContent =
                            'Valid from ' + fromDate + ' to ' + toDate;
                    }
                    renderQR(data.passno, data.qrCodeUrl, data);

                    // ⚡ ULTRA-FAST INSTANT PASS DISPLAY (0.02 - 0.08s) ⚡
                    // Display pass card IMMEDIATELY without waiting for image network downloads!
                    showPassCard();

                    var photoEl = document.getElementById('passPhoto');
                    var wrapper = document.getElementById('photoWrapper');
                    if (!photoEl) return;

                    photoEl.referrerPolicy = 'no-referrer';
                    photoEl.onerror = function() {
                        this.onerror = null;
                        this.src = 'images/DTC1.png';
                        this.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                    };

                    // ── Instant photo from cache (0 ms) ──────────
                    var cachedPhoto = localStorage.getItem('pass_photo_local_' + data.passno) || sessionStorage.getItem('passPhotoCache');
                    if (cachedPhoto) {
                        photoEl.src = cachedPhoto;
                        photoEl.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                        return;
                    }

                    if (data.photoUrl && data.photoUrl.trim() !== '') {
                        photoEl.src = data.photoUrl;
                        photoEl.style.display = 'block';

                        photoEl.onload = function() {
                            if (wrapper) wrapper.classList.add('loaded');
                            try {
                                var canvas = document.createElement('canvas');
                                canvas.width  = 250;
                                canvas.height = 250;
                                var ctx = canvas.getContext('2d');
                                ctx.drawImage(photoEl, 0, 0, 250, 250);
                                var dataURL = canvas.toDataURL('image/jpeg', 0.8);
                                localStorage.setItem('pass_photo_local_' + data.passno, dataURL);
                                sessionStorage.setItem('passPhotoCache', dataURL);
                            } catch (e) {
                                // Ignore CORS canvas restrictions
                            }
                        };
                    } else {
                        photoEl.src = 'images/DTC1.png';
                        photoEl.style.display = 'block';
                        if (wrapper) wrapper.classList.add('loaded');
                    }
                }

                function setFallback() {
                    document.getElementById('blink').textContent   = passno.startsWith('LOOKUP_') ? ('Mobile: ' + mobileParam) : passno;
                    document.getElementById('passName').textContent = nameParam.toUpperCase() || 'USER';
                    
                    var photoEl = document.getElementById('passPhoto');
                    var cachedPhoto = localStorage.getItem('pass_photo_local_' + passno) || sessionStorage.getItem('passPhotoCache');
                    if (cachedPhoto) {
                        photoEl.src = cachedPhoto;
                    } else {
                        photoEl.src = 'images/DTC1.png';
                    }
                    photoEl.style.display = 'block';
                    var w = document.getElementById('photoWrapper');
                    if (w) w.classList.add('loaded');

                    var today  = new Date();
                    var toDate = new Date(); toDate.setDate(today.getDate() + 150);
                    var fmt    = function(d) { return d.toLocaleDateString('en-GB'); };
                    var validityText;
                    if (dobParam) {
                        validityText = 'Mobile: ' + mobileParam + ' | DOB: ' + dobParam;
                    } else {
                        validityText = 'Valid from ' + fmt(today) + ' to ' + fmt(toDate);
                    }
                    document.getElementById('passValidity').textContent = validityText;
                    if (!passno.startsWith('LOOKUP_')) {
                        renderQR(passno, null, { passno: passno, name: nameParam });
                    }

                    // Show pass and hide loading
                    showPassCard();
                }

                // Try to load cached data first (sessionStorage = current tab, localStorage = persistent)
                var cachedData = null;
                try {
                    var rawCached = sessionStorage.getItem('epass_data_' + passno);
                    if (rawCached) {
                        cachedData = JSON.parse(rawCached);
                    }
                } catch (e) {
                    console.warn('Error reading from sessionStorage:', e);
                }

                // Also check localStorage persistent cache (survives tab/browser restart)
                if (!cachedData) {
                    try {
                        var rawPersistent = localStorage.getItem('epass_persistent_' + passno);
                        if (rawPersistent) {
                            cachedData = JSON.parse(rawPersistent);
                        }
                    } catch (e) {
                        console.warn('Error reading from localStorage:', e);
                    }
                }

                // If we have cached data or parameters from QR scan, show it immediately (0.02 - 0.08s)
                if (cachedData) {
                    renderPassData(cachedData);
                } else if (nameParam || vfParam) {
                    var immediatePassData = {
                        passno: passno,
                        name: nameParam,
                        validFrom: vfParam || new Date().toISOString(),
                        validTo: vtParam || new Date(Date.now() + 150 * 86400000).toISOString(),
                        category: catParam || 'Student All route AC/Non AC',
                        photoUrl: pParam || ''
                    };
                    renderPassData(immediatePassData);
                }

                // Offline / LOOKUP mode — cached data already shown above, nothing more to do
                if (isOffline || passno.startsWith('LOOKUP_')) {
                    return;
                }

                // ── Silent retry loop ─────────────────────────────────────────
                // Keeps the spinner visible and retries every 8 s until the
                // backend wakes up and returns real data. Nothing is ever shown
                // on screen while waiting — only the loading spinner.
                var _retryTimer = null;
                var _maxRetries = 20; // 20 × 8 s = ~2.7 min max wait
                var _attempt    = 0;

                async function _fetchPass() {
                    _attempt++;
                    var data = null;

                    // 1️⃣ Try local/Render API
                    try {
                        var ctrl  = new AbortController();
                        var timer = setTimeout(function() { ctrl.abort(); }, 10000);
                        var resp  = await fetch(apiHost + '/api/passes/' + passno + '?t=' + Date.now(),
                                               { signal: ctrl.signal });
                        clearTimeout(timer);
                        if (resp && resp.ok) {
                            data = await resp.json();
                        }
                    } catch (_e1) {}

                    // 2️⃣ Fallback to Render cloud if local didn't work
                    if (!data && apiHost !== 'https://dtcpass-backend-api.onrender.com') {
                        try {
                            var ctrl2  = new AbortController();
                            var timer2 = setTimeout(function() { ctrl2.abort(); }, 12000);
                            var resp2  = await fetch('https://dtcpass-backend-api.onrender.com/api/passes/' + passno + '?t=' + Date.now(),
                                                    { signal: ctrl2.signal });
                            clearTimeout(timer2);
                            if (resp2 && resp2.ok) {
                                data = await resp2.json();
                            }
                        } catch (_e2) {}
                    }

                    if (data) {
                        if (data.photoUrl && !window._preloadedPhoto) {
                            var pre = new Image();
                            pre.referrerPolicy = 'no-referrer';
                            pre.crossOrigin = 'anonymous';
                            pre.src = data.photoUrl;
                            window._preloadedPhoto = pre;
                        }
                        // ✅ Got real data — render pass and update caches
                        renderPassData(data);
                        try {
                            sessionStorage.setItem('epass_data_' + data.passno, JSON.stringify(data));
                            localStorage.setItem('epass_persistent_' + data.passno, JSON.stringify(data));
                        } catch (_ce) {}
                        if (passno !== data.passno) {
                            window.history.replaceState({}, '', '?passno=' + data.passno);
                        }
                        return; // Done — do NOT schedule another retry
                    }

                    // ❌ No data yet — keep spinner visible and retry silently
                    if (_attempt < _maxRetries) {
                        _retryTimer = setTimeout(_fetchPass, 8000);
                    }
                    // If max retries exhausted: spinner stays visible with no extra message.
                    // User can reload the page manually.
                }

                _fetchPass();
            })();
        </script>
    </body>
